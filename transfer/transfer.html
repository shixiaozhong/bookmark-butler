<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="transfer_page_title"></title>
    <link rel="stylesheet" href="../popup/popup.css" />
    <link rel="stylesheet" href="transfer.css" />
    <script type="module" src="transfer.js"></script>
  </head>
  <body>
    <main class="page">
      <h1 data-i18n="transfer_heading"></h1>

      <section class="card" aria-labelledby="export-title">
        <h2 id="export-title" data-i18n="export_title"></h2>
        <p class="card-note" data-i18n="export_note"></p>
        <label class="field">
          <span data-i18n="export_scope"></span>
          <select id="export-scope"></select>
        </label>
        <div class="card-actions">
          <button type="button" id="export-button" class="button primary" data-i18n="export_button"></button>
          <p id="export-status" class="status" role="status"></p>
        </div>
      </section>

      <section class="card" aria-labelledby="import-title">
        <h2 id="import-title" data-i18n="import_title"></h2>
        <p class="card-note" data-i18n="import_note"></p>
        <label class="field">
          <span data-i18n="import_file"></span>
          <input id="import-file" type="file" accept=".html,.htm,text/html" />
        </label>

        <div id="import-options" hidden>
          <p id="import-summary" class="summary" role="status"></p>
          <label class="field">
            <span data-i18n="import_folder_name"></span>
            <input id="import-name" type="text" autocomplete="off" />
          </label>
          <label class="field">
            <span data-i18n="import_parent"></span>
            <select id="import-parent"></select>
          </label>
          <label class="check-option">
            <input id="import-skip-existing" type="checkbox" checked />
            <span data-i18n="import_skip_existing"></span>
          </label>
          <label class="check-option" id="import-scripts-option" hidden>
            <input id="import-scripts" type="checkbox" />
            <span id="import-scripts-label"></span>
          </label>
          <div class="card-actions">
            <button type="button" id="import-button" class="button primary"></button>
          </div>
        </div>

        <progress id="import-progress" class="scan-progress" data-i18n-aria-label="import_progress" hidden></progress>
        <div id="import-result" class="result" hidden>
          <p id="import-result-text" role="status"></p>
          <button type="button" id="import-undo" class="button" data-i18n="import_undo"></button>
        </div>
        <p id="import-error" class="form-error" role="alert"></p>
      </section>
    </main>
  </body>
</html>
