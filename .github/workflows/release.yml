name: Release

# Pushing a tag like v0.3.0 publishes a GitHub Release with the extension zip attached.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check the tag matches the version
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json')).version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in manifest.json"
            exit 1
          fi
      # Runs the tests and checks the version numbers before building the zip.
      - run: npm run package
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --verify-tag \
            --title "Bookmark Butler $GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file .github/release-notes.md
